name: Build & Sign Production Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-installer:
    name: Build & Sign NIM_Agent_Setup.exe
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Browser Extension Dependencies & Build MV3
        run: |
          npm ci
          npm run build

      - name: Install Desktop Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          cd desktop
          pip install -e .
          pip install pyinstaller pystray

      - name: Freeze Standalone Desktop Executables (PyInstaller)
        run: |
          cd desktop
          python build_frozen.py

      - name: Sign Standalone Executables (Authenticode Dual SHA-256)
        if: env.AZURE_CREDENTIALS != ''
        uses: azure/trusted-signing-action@v0.4.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: desktop/dist/NIM_Agent
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.digicert.com
          timestamp-digest: SHA256

      - name: Install Inno Setup 6
        run: |
          choco install innosetup --no-progress -y

      - name: Compile Windows Installer (Inno Setup)
        run: |
          iscc installer/nim_agent_setup.iss

      - name: Sign NIM_Agent_Setup.exe Installer
        if: env.AZURE_CREDENTIALS != ''
        uses: azure/trusted-signing-action@v0.4.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: dist_installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.digicert.com
          timestamp-digest: SHA256

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIM_Agent_Setup
          path: dist_installer/NIM_Agent_Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/NIM_Agent_Setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
