kind = "web"
previewPath = "/"
title = "NIM Agent"
description = "A cinematic interactive landing page for NIM Agent, an AI-powered browser automation extension for research, navigation, tab control, and safe web interactions."
version = "1.0.0"
id = "artifacts/nim-agent"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20974

[services.development]
run = "pnpm --filter @workspace/nim-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nim-agent", "run", "build" ]
serve = "static"
publicDir = "artifacts/nim-agent/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20974"
BASE_PATH = "/"
