[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nim-jarvis-desktop"
version = "1.1.0"
description = "JARVIS Desktop AI Automation System - Native OS Partner for NIM Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "websockets>=12.0",
    "keyring>=25.0",
    "rich>=13.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "reportlab>=4.0",
    "psutil>=5.9",
    "numpy>=1.26",
    "pyautogui>=0.9.54",
    "mss>=9.0",
    "Pillow>=10.0",
    "beautifulsoup4>=4.12",
    "customtkinter>=5.2",
    "edge-tts>=6.1",
    "pygame>=2.6",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "SpeechRecognition>=3.10",
    "webrtcvad>=2.0.10",
    "pyaudio>=0.2.14; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'"
]

[project.scripts]
nim-jarvis = "src.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

