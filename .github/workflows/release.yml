name: Release / Build Extension Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package Chrome MV3 Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: |
          npm run type-check
          npm test

      - name: Build extension for Chrome MV3
        run: npm run build

      - name: Package extension bundle (.zip)
        run: |
          cd .output/chrome-mv3
          zip -r ../../nim-agent-chrome-mv3.zip .
          cd ../..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nim-agent-chrome-mv3
          path: nim-agent-chrome-mv3.zip

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nim-agent-chrome-mv3.zip
          draft: false
          prerelease: false
          generate_release_notes: true
